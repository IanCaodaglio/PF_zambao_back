name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: pf-zambao-back
  CONTAINER_NAME: artigos-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes
        run: mvn -B verify

      - name: Relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy na EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          NAME: ${{ env.CONTAINER_NAME }}
          AUTH0_ISSUER: ${{ vars.AUTH0_ISSUER || 'https://dev-vrz0ftntk7qkj44u.us.auth0.com/' }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE || 'https://avaliacoes-api' }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || 'http://localhost:5173' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,NAME,AUTH0_ISSUER,AUTH0_AUDIENCE,CORS_ALLOWED_ORIGINS,DB_PASSWORD
          script: |
            set -e
            docker pull "$IMAGE"

            # Garante o banco "artigosdb" dentro do Postgres existente (sem tocar nos outros bancos).
            if ! docker exec postgres-db psql -U usuario -d cursosdb -tAc \
                 "SELECT 1 FROM pg_database WHERE datname='artigosdb'" | grep -q 1; then
              docker exec postgres-db psql -U usuario -d cursosdb -c "CREATE DATABASE artigosdb"
            fi

            # Libera a porta 8080 removendo a versão anterior (e a API antiga de avaliações, se existir).
            docker rm -f "$NAME" avaliacoes-api 2>/dev/null || true

            docker run -d --name "$NAME" --restart unless-stopped \
              --network rede \
              -p 8080:8080 \
              -e DB_URL="jdbc:postgresql://postgres-db:5432/artigosdb" \
              -e DB_USER="usuario" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e AUTH0_ISSUER="$AUTH0_ISSUER" \
              -e AUTH0_AUDIENCE="$AUTH0_AUDIENCE" \
              -e CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
              "$IMAGE"
            docker image prune -f
